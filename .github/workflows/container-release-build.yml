name: container_release_build

on:
  
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build release container for scanning
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:src"
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          tags: sqlbuildmanager:release-scan
      -
        name: Scan release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sqlbuildmanager:release-scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      -
        name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:src"
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/sqlbuildmanager:${{ github.event.release.tag_name }}
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Push release image to Docker Hub
        shell: bash
        run: |
          source_image="ghcr.io/${{ github.repository_owner }}/sqlbuildmanager:${{ github.event.release.tag_name }}"
          target_image="blueskydevus/sqlbuildmanager:${{ github.event.release.tag_name }}"
          docker pull "$source_image"
          docker tag "$source_image" "$target_image"
          docker push "$target_image"
