name: Supply Chain Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget-audit:
    name: NuGet audit
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Audit locked dependency graph
        run: |
          dotnet restore ./src/SqlBuildManager-console.sln --locked-mode -p:ContinuousIntegrationBuild=true
          dotnet restore ./src/SqlBuildManager.DbInformation.UnitTest/SqlBuildManager.DbInformation.UnitTest.csproj --locked-mode -p:ContinuousIntegrationBuild=true
          dotnet restore ./src/SqlBuildManager.SqlBuild.Benchmarks/SqlBuildManager.SqlBuild.Benchmarks.csproj --locked-mode -p:ContinuousIntegrationBuild=true