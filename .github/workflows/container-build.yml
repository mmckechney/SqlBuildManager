name: container_build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container for scanning
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:src"
          platforms: linux/amd64
          load: true
          tags: sqlbuildmanager:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan container image (table format)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #0.36.0
        with:
          image-ref: sqlbuildmanager:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Build and push container
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:src"
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sqlbuildmanager:${{ steps.date.outputs.date }}
            ghcr.io/${{ github.repository_owner }}/sqlbuildmanager:latest-vNext
            ghcr.io/${{ github.repository_owner }}/sqlbuildmanager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest container provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sqlbuildmanager
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
